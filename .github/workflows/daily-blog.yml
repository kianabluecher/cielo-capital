name: Daily blog post

on:
  schedule:
    # 02:10 UTC = 06:10 Dubai, right after the dashboard's 06:00 refresh
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's post if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; no fresh post can be written."
          fi
          python scripts/generate_daily_post.py ${{ inputs.force && '--force' || '' }}

      - name: Commit post
        id: commit
        run: |
          git config user.name "cielo-blog-bot"
          git config user.email "cielo-blog-bot@users.noreply.github.com"
          git add site/blog
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new post."
          else
            git commit -m "blog: daily brief $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy site --project-name cielo-forecast --branch production
